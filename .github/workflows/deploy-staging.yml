name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build TypeScript
        run: npm run build

  deploy-staging:
    name: Deploy to Render (Staging)
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Staging Deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Render deploy hook returned HTTP $STATUS"
            exit 1
          fi
          echo "Deploy triggered successfully (HTTP $STATUS)"
